name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff==0.8.6
      - run: ruff check src tests scripts app.py

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov
          pip install -e . --no-deps
      - name: Run tests
        run: pytest -q --cov=metermind --cov-report=term-missing

  app:
    name: Dashboard renders
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          pip install -r requirements.txt
          pip install -e . --no-deps
      - name: Render the app
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, "src")
          from streamlit.testing.v1 import AppTest

          at = AppTest.from_file("app.py", default_timeout=300)
          at.run()
          assert not at.exception, at.exception
          assert len(at.tabs) == 5, f"expected 5 tabs, found {len(at.tabs)}"
          assert not at.error, [e.value for e in at.error]
          print(f"rendered {len(at.tabs)} tabs, {len(at.metric)} metrics, no exceptions")
          PY
