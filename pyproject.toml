[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "metermind"
version = "1.0.0"
description = "Residential smart meter intelligence: calibrated bill-shock forecasting, learned load-shape personas and causal demand-response targeting."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [{ name = "Adwitiya Shukla" }]
keywords = ["smart-meter", "energy", "conformal-prediction", "causal-inference", "uplift-modelling", "duckdb"]

[project.urls]
Homepage = "https://github.com/adwitiyashukla/metermind"

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
metermind = "metermind.cli:main"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"app.py" = ["E402"]

[tool.coverage.report]
exclude_also = [
    "if __name__ == .__main__.:",
    "except ImportError",
    "raise ImportError",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
filterwarnings = ["ignore::DeprecationWarning"]
